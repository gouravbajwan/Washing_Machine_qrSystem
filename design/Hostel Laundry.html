document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

5)<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column:1 / -1\"><div style=\"font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F5E82\">Motion<\u002Fdiv>\n<div style=\"margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n<sc-for list=\"{{ motion }}\" as=\"mo\" hint-placeholder-count=\"9\">\n<div style=\"padding:14px 18px;border-radius:20px;background:#F5F3FD\"><div style=\"font-size:15px;font-weight:700\">{{ mo.n }}<\u002Fdiv><div style=\"margin-top:2px;font-size:13px;font-weight:500;color:#5F5E82\">{{ mo.v }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column:1 / -1\"><div style=\"font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F5E82\">Components<\u002Fdiv>\n<div style=\"margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n<div style=\"border-radius:26px;background:#F5F3FD;overflow:hidden;display:flex;flex-direction:column\"><div style=\"position:relative;height:170px;overflow:hidden\"><div style=\"position:absolute;left:0;right:0;bottom:0\"><dc-import name=\"Water\" height=\"{{ 110 }}\" level=\"{{ 0.5 }}\" mode=\"active\" mood=\"float\" sprite-size=\"{{ 70 }}\" label=\"52%\" label-size=\"{{ 20 }}\" min-fill=\"{{ 0.2 }}\" max-fill=\"{{ 0.6 }}\" hint-size=\"100%,110px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><div style=\"padding:14px 18px;font-size:14px;font-weight:700;background:#fff\">Water panel<\u002Fdiv><\u002Fdiv>\n<div style=\"border-radius:26px;background:#F5F3FD;padding:20px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:700\">Status pill<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<span style=\"height:30px;display:inline-flex;align-items:center;gap:5px;padding:0 12px 0 9px;border-radius:999px;background:#DCF3E7;color:#1D6646;font-size:13px;font-weight:600\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8.5l3 3 7-7\"><\u002Fpath><\u002Fsvg>Free<\u002Fspan>\n<span style=\"height:30px;display:inline-flex;align-items:center;gap:5px;padding:0 12px 0 9px;border-radius:999px;background:#E5E2FC;color:#463AC0;font-size:13px;font-weight:600\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"2\" y=\"1.5\" width=\"12\" height=\"13\" rx=\"3\"><\u002Frect><circle cx=\"8\" cy=\"9\" r=\"3.4\"><\u002Fcircle><\u002Fsvg>In use<\u002Fspan>\n<span style=\"height:30px;display:inline-flex;align-items:center;gap:5px;padding:0 12px 0 9px;border-radius:999px;background:#ECECF0;color:#55556A;font-size:13px;font-weight:600\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"><\u002Fpath><\u002Fsvg>Out of order<\u002Fspan>\n<\u002Fdiv><div style=\"font-size:12px;color:#5F5E82\">Icon and colour both carry the status.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-radius:26px;background:#F5F3FD;padding:20px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:700\">Pastel tile<\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n<div style=\"height:52px;border-radius:18px;background:#ECEAFD;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:700\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>6:36<\u002Fdiv>\n<div style=\"height:52px;border-radius:18px;background:#F1F1F4;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700\">Grey<\u002Fdiv>\n<div style=\"height:52px;border-radius:18px;background:#FBF4E6;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700\">Cream<\u002Fdiv>\n<div style=\"height:52px;border-radius:18px;background:#F9EAE6;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700\">Blush<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"border-radius:26px;background:#F5F3FD;padding:20px;display:flex;align-items:center;gap:18px\"><svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 236 236\"><defs><linearGradient id=\"sg-ring\" sc-camel-gradient-units=\"userSpaceOnUse\" x1=\"118\" y1=\"0\" x2=\"118\" y2=\"236\"><stop offset=\"0\" stop-color=\"#C9C3FA\" stop-opacity=\".25\"><\u002Fstop><stop offset=\".45\" stop-color=\"#9A91F3\"><\u002Fstop><stop offset=\"1\" stop-color=\"#5A4FD4\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs><circle cx=\"118\" cy=\"118\" r=\"106\" fill=\"none\" stroke=\"#E4E1F4\" stroke-width=\"12\"><\u002Fcircle><circle cx=\"118\" cy=\"118\" r=\"106\" fill=\"none\" stroke=\"url(#sg-ring)\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-dasharray=\"666\" stroke-dashoffset=\"230\" transform=\"rotate(-90 118 118)\"><\u002Fcircle><text x=\"118\" y=\"132\" text-anchor=\"middle\" font-family=\"Outfit\" font-weight=\"700\" font-size=\"44\" fill=\"#23224A\">65%<\u002Ftext><\u002Fsvg><div><div style=\"font-size:14px;font-weight:700\">Progress ring<\u002Fdiv><div style=\"font-size:12px;color:#5F5E82;margin-top:2px\">8px track, 10px stroke, tail fades to 25%<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"border-radius:26px;background:#F5F3FD;padding:20px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:700\">Slide button<\u002Fdiv><div style=\"position:relative;height:64px;border-radius:999px;background:#23224A;color:#fff;display:flex;align-items:center;justify-content:center;padding-left:52px;font-size:15px;font-weight:600\"><div style=\"position:absolute;left:4px;top:4px;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#23224A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 6l6 6-6 6M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>Slide to start<\u002Fdiv><div style=\"font-size:12px;color:#5F5E82\">Tap fallback below; Enter key confirms.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-radius:26px;background:#F5F3FD;padding:20px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:700\">Bottom pill nav · input<\u002Fdiv><div style=\"height:60px;border-radius:999px;background:#fff;box-shadow:0 18px 36px -22px rgba(60,48,160,.35);padding:5px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);font-size:13px;font-weight:600;color:#5F5E82\"><span style=\"display:grid;place-items:center\">Ground<\u002Fspan><span style=\"display:grid;place-items:center\">Floor 1<\u002Fspan><span style=\"display:grid;place-items:center\">Floor 2<\u002Fspan><span style=\"display:grid;place-items:center;border-radius:999px;background:#23224A;color:#fff\">Floor 3<\u002Fspan><\u002Fdiv><div style=\"height:56px;border-radius:20px;background:#fff;display:flex;align-items:center;padding:0 18px;font-size:17px;font-weight:600\">Priya<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"2s\" style=\"display:flex;flex-direction:column;gap:24px\">\n<h2 style=\"margin:0;font-size:24px;font-weight:700\">Water wave spec<\u002Fh2>\n<div style=\"width:1240px;box-sizing:border-box;padding:48px;border-radius:40px;background:#fff;display:grid;grid-template-columns:420px 1fr;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div style=\"position:relative;height:300px;border-radius:32px;overflow:hidden;background:#F5F3FD\"><div style=\"position:absolute;left:0;right:0;bottom:0\"><dc-import name=\"Water\" height=\"{{ 220 }}\" level=\"{{ waveLevel }}\" mode=\"active\" mood=\"float\" sprite-size=\"{{ 90 }}\" label=\"{{ waveLabel }}\" min-fill=\"{{ 0.14 }}\" max-fill=\"{{ 0.8 }}\" hint-size=\"100%,220px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<div role=\"radiogroup\" aria-label=\"Preview level\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n<sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"4\"><button role=\"radio\" aria-checked=\"{{ lv.sel }}\" sc-camel-on-click=\"{{ lv.on }}\" style=\"height:48px;border-radius:999px;border:0;background:{{ lv.bg }};color:{{ lv.fg }};font:600 14px 'Outfit',sans-serif;cursor:pointer;transition:background-color 240ms ease-out\">{{ lv.t }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:#5F5E82\">Tap a level to watch the 1.6s rise.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start\">\n<sc-for list=\"{{ spec }}\" as=\"sp\" hint-placeholder-count=\"8\">\n<div style=\"padding:16px 18px;border-radius:20px;background:#F5F3FD\"><div style=\"font-size:15px;font-weight:700\">{{ sp.n }}<\u002Fdiv><div style=\"margin-top:4px;font-size:13px;line-height:1.5;font-weight:500;color:#5F5E82;text-wrap:pretty\">{{ sp.v }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nfunction qr(seed) {\n  const N = 29, g = Array.from({ length: N }, () => Array(N).fill(0));\n  let x = seed * 9301 + 49297;\n  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;\n  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) g[r][c] = rnd() > 0.52 ? 1 : 0;\n  const finder = (r0, c0) => { for (let r = -1; r < 8; r++) for (let c = -1; c < 8; c++) { const R = r0 + r, C = c0 + c; if (R < 0 || C < 0 || R >= N || C >= N) continue; const ring = Math.max(Math.abs(r - 3), Math.abs(c - 3)); g[R][C] = (r < 0 || c < 0 || r > 6 || c > 6) ? 0 : (ring === 2 ? 0 : 1); } };\n  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);\n  for (let r = N - 9; r < N - 4; r++) for (let c = N - 9; c < N - 4; c++) { const ring = Math.max(Math.abs(r - (N - 7)), Math.abs(c - (N - 7))); g[r][c] = ring === 1 ? 0 : 1; }\n  for (let i = 8; i < N - 8; i++) { g[6][i] = i % 2 ? 0 : 1; g[i][6] = i % 2 ? 0 : 1; }\n  let d = '';\n  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (g[r][c]) d += `M${c} ${r}h1v1h-1z`;\n  return d;\n}\nconst TOK = [['bg', '#F5F3FD', '#13122A'], ['surface', '#FFFFFF', '#1D1C3A'], ['ink', '#23224A', '#EEEDFC'], ['ink-2', '#5F5E82', '#ABAACF'], ['line', '#E4E1F4', '#2E2D52'], ['field', '#F1EFFB', '#24233F'], ['nav', '#23224A', '#8A80F0'], ['mint', '#DCF3E7', '#1C3832'], ['mint-ink', '#1D6646', '#93E6C3'], ['peri', '#E5E2FC', '#2B2858'], ['peri-ink', '#463AC0', '#C7C1FF'], ['ooo', '#ECECF0', '#262638'], ['ooo-ink', '#55556A', '#B7B7C8'], ['lav', '#ECEAFD', '#272552'], ['cream', '#FBF4E6', '#2C2838'], ['blush', '#F9EAE6', '#33263A'], ['err-bg', '#FCEAE8', '#3A2132'], ['err-ink', '#9C2B24', '#FFB7B0']];\nconst MOTION = [\n  ['Wave drift', '8.5s / 11s / 14s · linear · infinite'], ['Water bob', '6s · ease-in-out · 5px'], ['Sprite bob', '5.5s · ease-in-out · 7px, ±3°'],\n  ['Level change', '1.6s · cubic-bezier(.4,0,.2,1)'], ['UI transitions', '240ms · ease-out (200–350ms range)'], ['Nav pill', '520ms · spring cubic-bezier(.34,1.56,.64,1)'],\n  ['Slide snap / return', '520ms · same spring, 420ms thumb bump'], ['Digit roll', '340ms · cubic-bezier(.2,.8,.2,1)'], ['Ring stroke', '1s · linear, every tick'],\n  ['Tile status wash', '800ms scale 1→1.035→1 + 900ms light sweep'], ['Floor cross-fade', '320ms · ease-out, 10px rise'], ['Live dot / skeleton', '2.4s pulse · 1.4s shimmer']\n];\nconst SPEC = [\n  ['Layers', 'Three SVG sine paths 800×40 at 2× panel width. Back #D4CFFB, mid #ABA3F6, front #8379EE at 94% opacity with a 2px white crest line. Sprite sits between mid and front, so its lower half reads through the water.'],\n  ['Drift', 'translateX(0 → −50%) per layer: back 14s reversed, mid 11s, front 8.5s, all linear. The path period is half the width so the loop is seamless.'],\n  ['Bob', 'Whole water group translateY 0 → −5px → 0 over 6s. Sprite adds its own 5.5s bob with ±3° rotate.'],\n  ['Amplitude by state', 'scaleY on each wave: in use 1, free 0.5, finished eases to 0.16 over 2.4s, out of order 0.03 with drift stopped.'],\n  ['Bubbles', '7 rings (4 when free, 0 when out of order), 6–10px, rising 150px over 6.4–9s with staggered negative delays. Opacity 0 → .85 → 0. Finished adds a 6-ring burst: scale .4 → 2.2, 1.1s, twice.'],\n  ['Level mapping', 'surfaceY = H × (1 − (min + progress × (max − min))). Defaults min .14, max .8. Applied as translateY on the group with a 1.6s ease. The % label rides 22px above the crest.'],\n  ['Started ripple', 'Three white ellipses at the waterline, scale .15 → 1.6, opacity .9 → 0, 1.6s, staggered 350ms. Water rises from below the panel to the first value.'],\n  ['Reduced motion', 'prefers-reduced-motion stops every drift, bob, bubble and ripple animation. Level changes become a 300ms opacity fade instead of a slide.']\n];\nclass Component extends DCLogic {\n  state = { lv: 1 };\n  renderVals() {\n    const L = [0, 0.35, 0.7, 1];\n    return {\n      moods: [\n        { mood: 'float', title: 'Floating', when: 'Machine in use, mid-wash', mode: 'active', level: 0.6, burst: false },\n        { mood: 'relax', title: 'Relaxed', when: 'Machine free, ready for someone', mode: 'calm', level: 0.2, burst: false },\n        { mood: 'cheer', title: 'Cheering', when: 'Wash finished', mode: 'settle', level: 0.8, burst: true },\n        { mood: 'sleepy', title: 'Sleepy', when: 'Out of order', mode: 'flat', level: 0.3, burst: false }\n      ],\n      qrMachines: [1, 2, 3, 4, 5, 6].map(n => ({ name: 'Washer ' + n, floor: 'Floor 3', d: qr(n * 7) })),\n      qrMasters: ['Ground floor', 'Floor 1', 'Floor 2', 'Floor 3'].map((f, i) => ({ floor: f, d: qr(100 + i * 13) })),\n      tokens: TOK.map(([n, l, d]) => ({ n, l, d })),\n      motion: MOTION.map(([n, v]) => ({ n, v })),\n      spec: SPEC.map(([n, v]) => ({ n, v })),\n      waveLevel: L[this.state.lv], waveLabel: Math.round(L[this.state.lv] * 100) + '%',\n      levels: L.map((v, i) => ({ t: Math.round(v * 100) + '%', sel: i === this.state.lv, bg: i === this.state.lv ? '#23224A' : '#F1EFFB', fg: i === this.state.lv ? '#fff' : '#23224A', on: () => this.setState({ lv: i }) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
